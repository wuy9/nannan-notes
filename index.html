<!DOCTYPE html>
<html lang="zh-CN" data-k="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>南南的沉淀库</title>
<meta name="description" content="个人沉淀库：把值得留住的东西存下来。">
<style>
:root{
  --bg:#f7f3ec; --paper:#fffdf8; --ink:#2b2622; --ink-2:#6b6259; --ink-3:#9a9085;
  --line:#e6ddd0; --line-2:#f0e9dd; --accent:#b5563a; --accent-soft:#f3e2db;
  --on-c:#ffffff;
  --shadow:0 1px 2px rgba(74,56,38,.06), 0 8px 24px -12px rgba(74,56,38,.18);
  --radius:14px;
  --fs:17px;
}
html[data-k="0"]{ --fs:15px; }
html[data-k="1"]{ --fs:17px; }
html[data-k="2"]{ --fs:19px; }
html[data-theme="dark"]{
  --bg:#1b1917; --paper:#232019; --ink:#ece5da; --ink-2:#a89f92; --ink-3:#7d7468;
  --line:#37322a; --line-2:#2c2721; --accent:#d97a5c; --accent-soft:#3a2a23;
  --on-c:#171410;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; display:flex; flex-direction:column;
  background:var(--bg); color:var(--ink);
  font-size:var(--fs);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.72; letter-spacing:.01em;
  transition:background .25s ease,color .25s ease;
}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}

/* ---------- 调色板 ---------- */
[data-c="clay"]{--c:#b5563a}
[data-c="amber"]{--c:#b0801f}
[data-c="olive"]{--c:#6f8a3c}
[data-c="jade"]{--c:#2f7d6a}
[data-c="indigo"]{--c:#3f6ea8}
[data-c="plum"]{--c:#7a5aa6}
[data-c="rose"]{--c:#b35576}
[data-c="stone"]{--c:#6b6259}
html[data-theme="dark"] [data-c="clay"]{--c:#d98a6c}
html[data-theme="dark"] [data-c="amber"]{--c:#dbb367}
html[data-theme="dark"] [data-c="olive"]{--c:#a7be7a}
html[data-theme="dark"] [data-c="jade"]{--c:#6cc3a9}
html[data-theme="dark"] [data-c="indigo"]{--c:#82a9de}
html[data-theme="dark"] [data-c="plum"]{--c:#b798e0}
html[data-theme="dark"] [data-c="rose"]{--c:#e094ae}
html[data-theme="dark"] [data-c="stone"]{--c:#b0a79a}

/* ---------- 顶部 ---------- */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-2)}
.hd{display:flex;align-items:flex-end;gap:14px;padding:20px 0 12px;flex-wrap:wrap}
.brand{flex:1 1 auto;min-width:200px}
.brand h1{margin:0;font-size:1.42em;font-weight:650;letter-spacing:.02em}
.brand .sub{margin:2px 0 0;color:var(--ink-3);font-size:.78em;letter-spacing:.04em}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search{position:relative;display:flex;align-items:center}
.search input{
  width:220px;padding:9px 30px 9px 32px;font:inherit;font-size:.86em;color:var(--ink);
  background:var(--paper);border:1px solid var(--line);border-radius:999px;outline:none;
  transition:border-color .2s,box-shadow .2s,width .2s;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input::-webkit-search-cancel-button{display:none}
.search .ico{position:absolute;left:11px;color:var(--ink-3);font-size:.85em;pointer-events:none}
.search .clr{position:absolute;right:8px;border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:1em;line-height:1;padding:4px;display:none}
.search .clr.on{display:block}
button{font:inherit;cursor:pointer}
.btn{
  border:1px solid var(--line);background:var(--paper);color:var(--ink-2);
  padding:8px 12px;border-radius:999px;font-size:.82em;transition:.18s;white-space:nowrap;
}
.btn:hover{color:var(--ink);border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.icon{padding:8px 10px;font-size:.9em;line-height:1}

/* ---------- 筛选栏 ---------- */
.fbar{display:flex;align-items:center;gap:7px;padding:0 0 10px;overflow-x:auto;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.fbar-l{flex:none;font-size:.68em;color:var(--ink-3);letter-spacing:.12em;padding-right:1px;user-select:none}
.chip{
  flex:none;border:1px solid var(--line);background:transparent;color:var(--ink-2);
  padding:3px 11px;border-radius:999px;font-size:.75em;white-space:nowrap;transition:.18s;
}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[data-c]{border-color:color-mix(in srgb,var(--c) 34%,var(--line))}
.chip[data-c]::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.chip[aria-pressed="true"]{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-c);font-weight:600}
.chip[aria-pressed="true"]::before{background:var(--on-c);opacity:.85}
.chip .n{opacity:.55;margin-left:7px;font-size:.9em}
.gchip{border-radius:7px;padding:3px 10px}
.gchip[aria-pressed="true"]{background:var(--ink-2);border-color:var(--ink-2);color:var(--paper)}
.chip.gear{padding:3px 9px;letter-spacing:0}

/* ---------- 列表 ---------- */
main{padding:18px 0 8px;flex:1 0 auto}
.grp-hd{display:flex;align-items:center;gap:8px;margin:16px 2px 10px;font-size:.78em;color:var(--ink-2);letter-spacing:.05em;font-weight:600}
.grp:first-child .grp-hd{margin-top:0}
.grp-hd::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--ink-3);opacity:.55}
.grp-hd .grp-n{font-weight:400;color:var(--ink-3);font-size:.85em}
.card{
  background:var(--paper);border:1px solid var(--line-2);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow);
  transition:border-color .2s,background .25s;position:relative;
}
.card:hover{border-color:var(--line)}
.card[data-c]{
  background:color-mix(in srgb,var(--c) 8%,var(--paper));
  border-color:color-mix(in srgb,var(--c) 24%,var(--line-2));
  box-shadow:inset 3px 0 0 var(--c),var(--shadow);
}
.card[data-c]:hover{border-color:color-mix(in srgb,var(--c) 40%,var(--line-2))}
html[data-theme="dark"] .card[data-c]{background:color-mix(in srgb,var(--c) 13%,var(--paper))}
.card h2{margin:0 0 8px;font-size:1.06em;font-weight:640;line-height:1.5}
.card .body{color:var(--ink-2);font-size:.92em;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .body b,.card .body strong{font-weight:700;color:var(--ink)}
.card .body span[data-c]{color:var(--c)}
.card .body i,.card .body em{font-style:italic}
.card.open .body{-webkit-line-clamp:unset;display:block}
.more{display:inline-block;border:0;background:none;color:var(--accent);font-size:.76em;padding:6px 0 0;letter-spacing:.02em}
.card.open .more{margin-top:2px}
.card .meta{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.card .date{color:var(--ink-3);font-size:.74em;letter-spacing:.03em}
.card .spacer{flex:1}
.tag{display:inline-block;border:0;background:var(--accent-soft);color:var(--accent);
  font-size:.72em;padding:2px 9px;border-radius:6px;letter-spacing:.02em;line-height:1.9;font-family:inherit}
.tag[data-c]{background:color-mix(in srgb,var(--c) 15%,var(--paper));color:color-mix(in srgb,var(--c) 88%,var(--ink))}
html[data-theme="dark"] .tag[data-c]{background:color-mix(in srgb,var(--c) 20%,var(--paper));color:color-mix(in srgb,var(--c) 90%,var(--ink))}
.acts{display:flex;gap:6px;opacity:0;transition:opacity .2s;margin-left:auto}
.card:hover .acts,.card:focus-within .acts{opacity:1}
.act{border:0;background:none;color:var(--ink-3);font-size:.76em;padding:2px 4px}
.act:hover{color:var(--accent)}

.empty{text-align:center;color:var(--ink-3);padding:56px 20px;font-size:.9em;line-height:2}
.empty b{color:var(--ink-2);font-weight:600}

/* ---------- 底部 ---------- */
footer{border-top:1px solid var(--line-2);margin-top:26px;padding:18px 0 40px;
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--ink-3);font-size:.76em}
footer .spacer{flex:1}
footer button{border:0;background:none;color:var(--ink-3);font-size:1em;padding:4px 2px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
footer button:hover{color:var(--accent)}

/* ---------- 对话框 ---------- */
dialog{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:16px;
  padding:0;width:min(640px,calc(100vw - 28px));box-shadow:0 24px 60px -20px rgba(40,28,14,.45)}
dialog::backdrop{background:rgba(30,22,14,.42);backdrop-filter:blur(2px)}
.dlg-hd{display:flex;align-items:center;padding:18px 22px 0}
.dlg-hd h2{margin:0;font-size:1em;font-weight:640}
.dlg-bd{padding:14px 22px 4px;max-height:min(72vh,620px);overflow:auto}
.dlg-ft{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px 18px}
.f{display:block;margin-bottom:14px}
.f>span{display:block;font-size:.75em;color:var(--ink-3);margin-bottom:5px;letter-spacing:.05em}
.f input{width:100%;font:inherit;font-size:.88em;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none;transition:.18s}
.f input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:.72em;color:var(--ink-3);margin:-8px 0 14px;line-height:1.7}

/* ---------- 富文本 ---------- */
.rt{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg)}
.rt-bar{display:flex;align-items:center;gap:5px;padding:5px 7px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--paper) 55%,var(--bg));flex-wrap:wrap}
.rt-bar button{border:1px solid transparent;background:transparent;color:var(--ink-2);border-radius:6px;
  min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:.8em;line-height:1;padding:0 5px}
.rt-bar button:hover{border-color:var(--line);color:var(--ink);background:var(--paper)}
.rt-bar .sw{width:17px;height:17px;min-width:17px;padding:0;border-radius:50%;background:var(--c);
  border:1px solid rgba(0,0,0,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.rt-bar .sw:hover{transform:scale(1.15)}
.rt-bar button.wide{width:auto;padding:0 7px;font-size:.74em}
.rt-sep{width:1px;height:16px;background:var(--line);margin:0 3px}
.rt-edit{min-height:110px;max-height:220px;overflow:auto;padding:10px 12px;
  font-size:.88em;line-height:1.72;outline:none;word-break:break-word}
.rt-edit:empty::before{content:attr(data-ph);color:var(--ink-3)}
.rt-edit span[data-c]{color:var(--c)}

/* ---------- 编辑器里的零件 ---------- */
.tagprev{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 14px;min-height:22px}
.tagprev .tag{cursor:pointer}
.tagprev .tag:hover{outline:1px dashed var(--c,var(--accent));outline-offset:2px}
.tagprev-h{font-size:.72em;color:var(--ink-3)}
.swrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swrow button{width:24px;height:24px;border-radius:50%;border:1px solid rgba(0,0,0,.14);background:var(--c);padding:0;transition:.15s;position:relative}
.swrow button.none{background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px);border-color:var(--line)}
.swrow button:hover{transform:scale(1.1)}
.swrow button.on::after{content:"";position:absolute;inset:-4px;border:2px solid var(--c,var(--ink-3));border-radius:50%}
.swrow button.none.on::after{border-color:var(--ink-3)}

/* ---------- 标签颜色面板 ---------- */
#tagDlg{width:min(440px,calc(100vw - 28px))}
.trow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.trow:last-child{border-bottom:0}
.tname{flex:0 0 96px;font-size:.86em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tdots{display:flex;gap:7px;flex-wrap:wrap}
.dot{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.14);background:var(--c);padding:0;position:relative;transition:.15s}
.dot:hover{transform:scale(1.12)}
.dot.none{background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px);border-color:var(--line)}
.dot.on::after{content:"";position:absolute;inset:-4px;border:2px solid var(--c,var(--ink-3));border-radius:50%}
.dot.none.on::after{border-color:var(--ink-3)}

/* ---------- 浮动小调色板 ---------- */
.pal{position:fixed;z-index:80;background:var(--paper);border:1px solid var(--line);border-radius:11px;
  padding:8px;box-shadow:0 14px 34px -10px rgba(40,28,14,.4);display:grid;grid-template-columns:repeat(9,20px);gap:7px;width:auto}
.pal button{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.14);background:var(--c);padding:0;position:relative}
.pal button.none{background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px);border-color:var(--line);font-size:10px;line-height:18px;color:var(--ink-3)}
.pal button:hover{transform:scale(1.15)}
.pal button.on::after{content:"";position:absolute;inset:-3px;border:2px solid var(--c,var(--ink-3));border-radius:50%}
.pal button.none.on::after{border-color:var(--ink-3)}

/* ---------- 云端 ---------- */
footer .cloud{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;
  padding:4px 11px;text-decoration:none;color:var(--ink-3);transition:.18s}
footer .cloud:hover{border-color:var(--ink-3);color:var(--ink)}
footer .cloud::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3);opacity:.5;transition:.2s}
footer .cloud[data-s="ok"]::before{background:#3f8f6a;opacity:1}
footer .cloud[data-s="saving"]::before{background:#c08a24;opacity:1;animation:blink 1s infinite}
footer .cloud[data-s="error"]::before{background:#c0504d;opacity:1}
@keyframes blink{50%{opacity:.25}}
#cloudDlg{width:min(520px,calc(100vw - 28px))}
.cloud-tip{font-size:.78em;color:var(--ink-2);line-height:1.95;margin:0 0 16px}
.cloud-tip code{background:var(--bg);border:1px solid var(--line-2);border-radius:4px;padding:1px 5px;font-size:.93em}
.cloud-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.st{font-size:.76em;color:var(--ink-3);margin-top:12px;line-height:1.85;min-height:1.85em}
.st.bad{color:#c0504d}
.st.good{color:#3f8f6a}

@media (max-width:600px){
  .hd{flex-direction:column;align-items:stretch;gap:9px;padding:13px 0 9px}
  .brand{display:flex;align-items:baseline;gap:9px;min-width:0}
  .brand h1{font-size:1.2em;white-space:nowrap}
  .brand .sub{margin:0;font-size:.74em;white-space:nowrap}
  .tools{gap:6px;flex-wrap:nowrap}
  .search{flex:1 1 auto;min-width:0}
  .search input{width:100%}
  .search input:focus{width:100%}
  .btn.primary{padding:8px 13px}
  .fbar{padding-bottom:8px}
  .card{padding:15px 16px}
  .acts{opacity:1}
  .tname{flex-basis:74px}
  .dlg-bd{padding:12px 16px 2px}
  .dlg-ft{padding:12px 16px 16px}
  .rt-bar{gap:3px;padding:5px 6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .rt-bar::-webkit-scrollbar{display:none}
  .rt-bar button{min-width:24px;height:24px;padding:0 4px}
  .rt-bar .sw{width:14px;height:14px;min-width:14px}
  .rt-bar button.wide{font-size:.66em;padding:0 5px}
  .rt-sep{margin:0 1px}
}
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <div class="brand">
      <h1>南南的沉淀库</h1>
      <p class="sub" id="stat">正在读取…</p>
    </div>
    <div class="tools">
      <div class="search">
        <span class="ico">⌕</span>
        <input id="q" type="search" placeholder="搜索标题 / 正文 / 标签" autocomplete="off">
        <button class="clr" id="clrQ" title="清空">×</button>
      </div>
      <button class="btn primary" id="add">＋ 新增</button>
      <button class="btn icon" id="fontBtn" title="切换字号">A</button>
      <button class="btn icon" id="themeBtn" title="切换深浅色">◐</button>
    </div>
  </div>
  <div class="wrap" id="filters">
    <div class="fbar" id="groupBar" hidden></div>
    <div class="fbar" id="tagBar" hidden></div>
  </div>
</header>

<main class="wrap" id="list"></main>
<div class="empty" id="empty" hidden></div>

<footer class="wrap">
  <button class="cloud" id="cloudBtn" data-s="off" title="设置云端同步">本地保存</button>
  <span class="spacer"></span>
  <button id="expBtn">导出备份</button>
  <button id="impBtn">导入备份</button>
  <input type="file" id="impFile" accept="application/json,.json" hidden>
</footer>

<dialog id="dlg">
  <div class="dlg-hd"><h2 id="dlgTitle">新增一条</h2></div>
  <div class="dlg-bd">
    <label class="f"><span>标题</span><input id="fTitle" placeholder="一句话说清这条是什么"></label>

    <label class="f"><span>分组</span><input id="fGroup" list="groupOpts" placeholder="留空就不分组，例如：读书笔记">
      <datalist id="groupOpts"></datalist>
    </label>

    <div class="f">
      <span>正文</span>
      <div class="rt">
        <div class="rt-bar" id="rtBar">
          <button type="button" data-cmd="bold" title="加粗（选中文字后点，或 Ctrl+B）"><b>B</b></button>
          <button type="button" data-cmd="italic" title="斜体"><i>I</i></button>
          <button type="button" data-cmd="underline" title="下划线"><u>U</u></button>
          <span class="rt-sep"></span>
          <button type="button" class="sw" data-c="clay" data-fg="clay" title="砖红"></button>
          <button type="button" class="sw" data-c="amber" data-fg="amber" title="赭黄"></button>
          <button type="button" class="sw" data-c="olive" data-fg="olive" title="橄榄"></button>
          <button type="button" class="sw" data-c="jade" data-fg="jade" title="松绿"></button>
          <button type="button" class="sw" data-c="indigo" data-fg="indigo" title="靛青"></button>
          <button type="button" class="sw" data-c="plum" data-fg="plum" title="紫"></button>
          <button type="button" class="sw" data-c="rose" data-fg="rose" title="玫瑰"></button>
          <button type="button" class="sw" data-c="stone" data-fg="stone" title="石墨"></button>
          <span class="rt-sep"></span>
          <button type="button" data-cmd="removeFormat" class="wide" title="清除加粗和颜色">清除格式</button>
        </div>
        <div class="rt-edit" id="fBody" contenteditable="true" data-ph="想记下的内容。选中文字后点上面的按钮，可以加粗、换颜色。"></div>
      </div>
    </div>

    <label class="f"><span>标签</span><input id="fTags" placeholder="用逗号分隔，例如：读书, 方法"></label>
    <div class="tagprev" id="tagPrev"></div>

    <div class="f">
      <span>卡片颜色</span>
      <div class="swrow" id="cardSw"></div>
    </div>
  </div>
  <div class="dlg-ft">
    <button class="btn" id="cancelBtn">取消</button>
    <button class="btn primary" id="saveBtn">保存</button>
  </div>
</dialog>

<dialog id="tagDlg">
  <div class="dlg-hd"><h2>标签颜色</h2></div>
  <div class="dlg-bd" id="tagRows"></div>
  <div class="dlg-ft"><button class="btn primary" id="tagDone">完成</button></div>
</dialog>

<dialog id="cloudDlg">
  <div class="dlg-hd"><h2>云端同步</h2></div>
  <div class="dlg-bd">
    <p class="cloud-tip">
      连上之后，每次保存都会自动提交到 GitHub 私有仓库
      <code>wuy9/nannan-notes-data</code>。换电脑、换浏览器、清缓存都不丢；每次提交都有历史，误删还能找回。
    </p>
    <label class="f"><span>访问令牌（只存在这台设备的浏览器里）</span>
      <input id="cloudToken" type="password" placeholder="ghp_… 或 github_pat_…" autocomplete="off" spellcheck="false">
    </label>
    <p class="hint" style="margin:-2px 0 18px">
      还没有？<a href="https://github.com/settings/tokens/new?scopes=repo&amp;description=nannan-notes" target="_blank" rel="noopener">点这里生成</a>：勾上 <b>repo</b>，生成后复制那一串粘到上面。
    </p>
    <div class="cloud-row">
      <button class="btn primary" id="cloudConnect">连接并同步</button>
      <button class="btn" id="cloudOff">断开并改回本地</button>
    </div>
    <div class="st" id="cloudSt">未连接，现在只存在这台设备的浏览器里。</div>
  </div>
  <div class="dlg-ft"><button class="btn" id="cloudDone">完成</button></div>
</dialog>

<script>
(function () {
  "use strict";

  var KEY = "nn.entries.v1";
  var PREF = "nn.pref.v1";
  var TKEY = "nn.tagcolors.v1";

  var PAL = ["clay", "amber", "olive", "jade", "indigo", "plum", "rose", "stone"];
  var PALN = { clay: "砖红", amber: "赭黄", olive: "橄榄", jade: "松绿", indigo: "靛青", plum: "紫", rose: "玫瑰", stone: "石墨" };
  var LHEX = { clay: "#b5563a", amber: "#b0801f", olive: "#6f8a3c", jade: "#2f7d6a", indigo: "#3f6ea8", plum: "#7a5aa6", rose: "#b35576", stone: "#6b6259" };
  var DHEX = { clay: "#d98a6c", amber: "#dbb367", olive: "#a7be7a", jade: "#6cc3a9", indigo: "#82a9de", plum: "#b798e0", rose: "#e094ae", stone: "#b0a79a" };

  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement;

  /* ---------------- 小工具 ---------------- */
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function now() { return new Date().toISOString(); }
  function fmt(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "";
    var p = function (n) { return n < 10 ? "0" + n : "" + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function textToHtml(s) {
    return esc(String(s || "").replace(/\r\n/g, "\n")).replace(/\n/g, "<br>");
  }
  function textOf(html) {
    var d = document.createElement("div");
    d.innerHTML = String(html || "").replace(/<br\s*\/?>/gi, "\n");
    return d.textContent || "";
  }

  /* ---------------- 富文本清洗 ---------------- */
  var parser = new DOMParser();
  var probe = document.createElement("span");
  function cssColor(v) {
    if (!v) return "";
    probe.style.color = "";
    probe.style.color = String(v);
    return probe.style.color || "";
  }
  /* 调色板里的颜色记成 data-c，跟着深浅色一起变；其它颜色保留原值 */
  var PALMAP = {};
  (function () {
    for (var k in LHEX) { PALMAP[cssColor(LHEX[k])] = k; }
    for (var k2 in DHEX) { PALMAP[cssColor(DHEX[k2])] = k2; }
  })();
  function styleParts(el) {
    var out = [], pal = "", c = el.style;
    if (!c) return { style: "", pal: "" };
    if (c.color) {
      var v = cssColor(c.color);
      if (v) { pal = PALMAP[v] || ""; if (!pal) out.push("color:" + v); }
    }
    if (c.backgroundColor) { var bg = cssColor(c.backgroundColor); if (bg && bg !== "rgba(0, 0, 0, 0)") out.push("background-color:" + bg); }
    if (c.fontWeight && /^(bold|bolder|[6-9]00)$/i.test(String(c.fontWeight))) out.push("font-weight:bold");
    if (c.fontStyle === "italic") out.push("font-style:italic");
    if (/underline/.test(c.textDecoration || "")) out.push("text-decoration:underline");
    return { style: out.join(";"), pal: pal };
  }
  function wrap(inner, parts) {
    var a = "";
    if (parts.pal) a += ' data-c="' + parts.pal + '"';
    if (parts.style) a += ' style="' + parts.style + '"';
    return a ? "<span" + a + ">" + inner + "</span>" : inner;
  }
  function ser(n) {
    var out = "";
    for (var i = 0; i < n.childNodes.length; i++) {
      var c = n.childNodes[i];
      if (c.nodeType === 3) { out += esc(c.nodeValue); continue; }
      if (c.nodeType !== 1) continue;
      var t = c.tagName;
      if (t === "BR") { out += "<br>"; continue; }
      var inner = ser(c);
      if (!inner) continue;
      if (t === "B" || t === "STRONG") out += "<b>" + inner + "</b>";
      else if (t === "I" || t === "EM") out += "<i>" + inner + "</i>";
      else if (t === "U") out += "<u>" + inner + "</u>";
      else if (t === "S" || t === "STRIKE" || t === "DEL") out += "<s>" + inner + "</s>";
      else if (t === "FONT") {
        var col = cssColor(c.getAttribute("color") || "");
        if (!col) out += inner;
        else if (PALMAP[col]) out += '<span data-c="' + PALMAP[col] + '">' + inner + "</span>";
        else out += '<span style="color:' + col + '">' + inner + "</span>";
      } else {
        var parts = styleParts(c);
        if (!parts.pal) {
          var dc = c.getAttribute("data-c");
          if (dc && PALN[dc]) parts.pal = dc;
        }
        out += wrap(inner, parts);
      }
    }
    return out;
  }
  function clean(html) {
    if (!html) return "";
    var doc = parser.parseFromString('<div id="__r">' + String(html) + "</div>", "text/html");
    var r = doc.getElementById("__r");
    if (!r) return "";
    var blocks = r.querySelectorAll("div,p,li,blockquote,h1,h2,h3,h4,h5,h6,ul,ol,table,tr,td");
    for (var i = blocks.length - 1; i >= 0; i--) {
      var el = blocks[i];
      if (!el.parentNode) continue;
      var br = doc.createElement("br");
      el.parentNode.insertBefore(br, el.nextSibling);
      while (el.firstChild) el.parentNode.insertBefore(el.firstChild, el);
      el.parentNode.removeChild(el);
    }
    var out = ser(r).replace(/(<br>)+$/, "");
    return /^$/.test(out.replace(/<br>/g, "")) ? "" : out;
  }

  /* ---------------- 存储 ---------------- */
  function readJSON(k, fb) {
    try {
      var raw = localStorage.getItem(k);
      return raw ? JSON.parse(raw) : fb;
    } catch (e) { return fb; }
  }
  function loadEntries() {
    var arr = readJSON(KEY, null);
    return Array.isArray(arr) ? arr : null;
  }
  function save(arr) {
    try { localStorage.setItem(KEY, JSON.stringify(arr)); }
    catch (e) { alert("保存失败：浏览器存储不可用或已满。"); return false; }
    scheduleSync();
    return true;
  }
  var tagColors = readJSON(TKEY, {});
  if (!tagColors || typeof tagColors !== "object" || Array.isArray(tagColors)) tagColors = {};
  function saveTagColors() {
    try { localStorage.setItem(TKEY, JSON.stringify(tagColors)); } catch (e) {}
    scheduleSync();
  }

  /* 兼容老数据：v1 的纯文本正文转成 HTML，并补齐 group / color 字段 */
  function migrate(list) {
    return list.map(function (e) {
      var rich = e && e.rich === true;
      var body = String((e && e.body) || "");
      return {
        id: (e && e.id) || uid(),
        title: String((e && e.title) || ""),
        body: rich ? body : textToHtml(body),
        rich: true,
        tags: Array.isArray(e && e.tags) ? (e.tags || []).map(String) : [],
        group: e && e.group ? String(e.group) : "",
        color: e && e.color && PALN[e.color] ? String(e.color) : "",
        created: (e && e.created) || now(),
        updated: (e && (e.updated || e.created)) || now()
      };
    });
  }

  /* 首次进来放一条示例，把新功能都演一遍，随时可删 */
  function seed() {
    return [{
      id: uid(),
      title: "示例：这条是给你试手的，看完可以删",
      body: "这张卡片上能试的东西：" +
        "<br><br>· <b>选中文字</b>后点编辑器里的 <b>B</b> → 加粗；点色块 → 换颜色。" +
        "<br>· 比如<span data-c=\"jade\">这几个字是松绿色的</span>，<b>这几个是粗的</b>。" +
        "<br>· 「卡片颜色」能让整张条目的底色换一种，一眼区分开。" +
        "<br>· 标签也能单独设颜色：点标签栏最右边的 ⚙。" +
        "<br>· 「分组」可以把几条归到一起，列表会按组排。" +
        "<br><br>你现在看到的这条，属于分组「示例」、卡片色「砖红」、标签是「测试」和「使用说明」。删掉它，换上你自己的。",
      rich: true,
      tags: ["测试", "使用说明"],
      group: "示例",
      color: "clay",
      created: now(),
      updated: now()
    }];
  }

  var raw = loadEntries();
  var entries = migrate(raw === null ? seed() : raw);
  save(entries);

  var prefs = readJSON(PREF, {}) || {};
  function savePrefs() {
    try { localStorage.setItem(PREF, JSON.stringify(prefs)); } catch (e) {}
  }

  /* ---------------- 状态 ---------------- */
  var q = "";
  var activeTags = [];
  var activeGroup = "*";
  var editingId = null;
  var editingColor = "";

  var listEl = $("list"), emptyEl = $("empty"), tagBar = $("tagBar"),
      groupBar = $("groupBar"), statEl = $("stat"), filtersEl = $("filters");

  function isDark() { return root.getAttribute("data-theme") === "dark"; }

  /* ---------------- 主题 / 字号 ---------------- */
  root.setAttribute("data-theme", prefs.theme || "light");
  root.setAttribute("data-k", typeof prefs.k === "number" ? prefs.k : 1);

  $("themeBtn").addEventListener("click", function () {
    root.setAttribute("data-theme", isDark() ? "light" : "dark");
    prefs.theme = root.getAttribute("data-theme"); savePrefs();
  });
  $("fontBtn").addEventListener("click", function () {
    var k = (parseInt(root.getAttribute("data-k"), 10) + 1) % 3;
    root.setAttribute("data-k", k);
    prefs.k = k; savePrefs();
  });

  /* ---------------- 汇总 ---------------- */
  function allTags() {
    var map = {};
    entries.forEach(function (e) {
      (e.tags || []).forEach(function (t) { map[t] = (map[t] || 0) + 1; });
    });
    return Object.keys(map).sort(function (a, b) { return map[b] - map[a]; })
      .map(function (t) { return { name: t, n: map[t] }; });
  }
  function allGroups() {
    var map = {};
    entries.forEach(function (e) { if (e.group) map[e.group] = (map[e.group] || 0) + 1; });
    return Object.keys(map).sort(function (a, b) { return map[b] - map[a] || a.localeCompare(b, "zh"); })
      .map(function (g) { return { name: g, n: map[g] }; });
  }
  function colorOfTag(t, cardColor) {
    var k = tagColors[t] || cardColor || "";
    return PALN[k] ? k : "";
  }

  function filtered() {
    var needle = q.trim().toLowerCase();
    return entries.filter(function (e) {
      var tags = e.tags || [];
      for (var i = 0; i < activeTags.length; i++) {
        if (tags.indexOf(activeTags[i]) === -1) return false;
      }
      if (activeGroup !== "*") {
        var g = e.group || "";
        if (activeGroup === "__none__") { if (g) return false; }
        else if (g !== activeGroup) return false;
      }
      if (!needle) return true;
      var hay = (e.title + " " + textOf(e.body) + " " + tags.join(" ") + " " + (e.group || "")).toLowerCase();
      return hay.indexOf(needle) !== -1;
    }).sort(function (a, b) {
      return (b.updated || b.created || "").localeCompare(a.updated || a.created || "");
    });
  }

  /* ---------------- 筛选栏 ---------------- */
  function renderGroups() {
    var groups = allGroups();
    var ungrouped = entries.filter(function (e) { return !e.group; }).length;
    if (!groups.length) {
      groupBar.hidden = true;
      if (activeGroup !== "*") activeGroup = "*";
      return;
    }
    groupBar.hidden = false;
    groupBar.innerHTML = "";
    var lab = document.createElement("span");
    lab.className = "fbar-l"; lab.textContent = "分组";
    groupBar.appendChild(lab);

    var items = [{ name: "全部", val: "*" }];
    groups.forEach(function (g) { items.push({ name: g.name, val: g.name, n: g.n }); });
    if (ungrouped) items.push({ name: "未分组", val: "__none__", n: ungrouped });

    items.forEach(function (it) {
      var b = document.createElement("button");
      b.className = "chip gchip";
      b.setAttribute("aria-pressed", activeGroup === it.val ? "true" : "false");
      b.appendChild(document.createTextNode(it.name));
      if (typeof it.n === "number") {
        var n = document.createElement("span");
        n.className = "n"; n.textContent = it.n;
        b.appendChild(n);
      }
      b.addEventListener("click", function () { activeGroup = it.val; render(); });
      groupBar.appendChild(b);
    });
  }

  function renderTags() {
    var tags = allTags();
    if (!tags.length) { tagBar.hidden = true; return; }
    tagBar.hidden = false;
    tagBar.innerHTML = "";
    var lab = document.createElement("span");
    lab.className = "fbar-l"; lab.textContent = "标签";
    tagBar.appendChild(lab);

    tags.forEach(function (t) {
      var b = document.createElement("button");
      b.className = "chip";
      var ck = tagColors[t.name];
      if (PALN[ck]) b.setAttribute("data-c", ck);
      b.setAttribute("aria-pressed", activeTags.indexOf(t.name) !== -1 ? "true" : "false");
      b.appendChild(document.createTextNode(t.name));
      var n = document.createElement("span");
      n.className = "n"; n.textContent = t.n;
      b.appendChild(n);
      b.addEventListener("click", function () {
        var i = activeTags.indexOf(t.name);
        if (i === -1) activeTags.push(t.name); else activeTags.splice(i, 1);
        render();
      });
      tagBar.appendChild(b);
    });

    var gear = document.createElement("button");
    gear.className = "chip gear";
    gear.title = "设置每个标签的颜色";
    gear.textContent = "⚙";
    gear.addEventListener("click", openTagCfg);
    tagBar.appendChild(gear);
  }

  /* ---------------- 列表 ---------------- */
  function groupRows(rows) {
    var order = [], map = {};
    rows.forEach(function (e) {
      var g = e.group || "";
      if (!map[g]) { map[g] = []; order.push(g); }
      map[g].push(e);
    });
    var named = order.filter(function (g) { return g; })
      .sort(function (a, b) { return map[b].length - map[a].length || a.localeCompare(b, "zh"); });
    var out = named.map(function (g) { return { name: g, items: map[g] }; });
    if (map[""]) out.push({ name: "", items: map[""] });
    return out;
  }

  function cardFor(e) {
    var card = document.createElement("article");
    card.className = "card";
    card.tabIndex = 0;
    if (e.color && PALN[e.color]) card.setAttribute("data-c", e.color);

    var h = document.createElement("h2");
    h.textContent = e.title || "（无标题）";
    card.appendChild(h);

    var body = document.createElement("div");
    body.className = "body";
    body.innerHTML = e.body || "";
    card.appendChild(body);

    var more = document.createElement("button");
    more.className = "more"; more.textContent = "展开全文 ↓";
    more.hidden = true;
    more.addEventListener("click", function (ev) { ev.stopPropagation(); toggle(); });
    card.appendChild(more);

    function toggle() {
      var on = card.classList.toggle("open");
      more.textContent = on ? "收起 ↑" : "展开全文 ↓";
      more.hidden = false;
    }

    var meta = document.createElement("div");
    meta.className = "meta";
    (e.tags || []).forEach(function (t) {
      var s = document.createElement("span");
      s.className = "tag"; s.textContent = t;
      var ck = colorOfTag(t, e.color);
      if (ck) s.setAttribute("data-c", ck);
      meta.appendChild(s);
    });
    var date = document.createElement("span");
    date.className = "date";
    date.textContent = fmt(e.updated || e.created);
    meta.appendChild(date);

    var sp = document.createElement("span");
    sp.className = "spacer"; meta.appendChild(sp);

    var acts = document.createElement("div");
    acts.className = "acts";
    var eb = document.createElement("button");
    eb.className = "act"; eb.textContent = "编辑";
    eb.addEventListener("click", function (ev) { ev.stopPropagation(); openEditor(e.id); });
    var db = document.createElement("button");
    db.className = "act"; db.textContent = "删除";
    db.addEventListener("click", function (ev) {
      ev.stopPropagation();
      if (confirm("删除「" + (e.title || "无标题") + "」？删了就找不回来了。")) {
        entries = entries.filter(function (x) { return x.id !== e.id; });
        save(entries); render();
      }
    });
    acts.appendChild(eb); acts.appendChild(db);
    meta.appendChild(acts);
    card.appendChild(meta);

    return card;
  }

  function afterAppend(card) {
    var body = card.querySelector(".body");
    var more = card.querySelector(".more");
    var canOpen = body.scrollHeight > body.clientHeight + 4;
    if (canOpen) {
      more.hidden = false;
      card.addEventListener("click", function () { card.classList.toggle("open"); more.textContent = card.classList.contains("open") ? "收起 ↑" : "展开全文 ↓"; });
      card.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); card.click(); }
      });
      card.style.cursor = "pointer";
    } else {
      more.remove();
    }
  }

  function render() {
    var rows = filtered();
    renderGroups();
    renderTags();
    listEl.innerHTML = "";

    var secs = groupRows(rows);
    var showHd = secs.length > 1 || (secs.length === 1 && secs[0].name);

    secs.forEach(function (sec) {
      var wrap = document.createElement("section");
      wrap.className = "grp";
      if (showHd) {
        var hd = document.createElement("div");
        hd.className = "grp-hd";
        var t = document.createElement("span");
        t.textContent = sec.name || "未分组";
        hd.appendChild(t);
        var n = document.createElement("span");
        n.className = "grp-n"; n.textContent = sec.items.length;
        hd.appendChild(n);
        wrap.appendChild(hd);
      }
      sec.items.forEach(function (e) { wrap.appendChild(cardFor(e)); });
      listEl.appendChild(wrap);
    });

    Array.prototype.forEach.call(listEl.querySelectorAll(".card"), afterAppend);

    var total = entries.length, shown = rows.length;
    var gcount = allGroups().length;
    statEl.textContent = (q || activeTags.length || activeGroup !== "*")
      ? "筛出 " + shown + " 条 / 共 " + total + " 条"
      : "共 " + total + " 条" + (gcount ? " · " + gcount + " 组" : "");

    if (!shown) {
      emptyEl.hidden = false;
      if (!total) {
        emptyEl.innerHTML = "这里还很空。<br><b>点右上角「＋ 新增」写下第一条。</b>";
      } else {
        emptyEl.innerHTML = "没有匹配的条目。<br>试试换个词，或者点掉上面的筛选。";
      }
    } else {
      emptyEl.hidden = true;
    }
  }

  /* ---------------- 搜索 ---------------- */
  var timer = null;
  $("q").addEventListener("input", function (ev) {
    q = ev.target.value;
    $("clrQ").classList.toggle("on", !!q);
    clearTimeout(timer);
    timer = setTimeout(render, 90);
  });
  $("clrQ").addEventListener("click", function () {
    q = ""; $("q").value = ""; $("clrQ").classList.remove("on"); render();
  });

  /* ---------------- 浮动调色板 ---------------- */
  var pal = null;
  function closePal() {
    if (!pal) return;
    if (pal.parentNode) pal.parentNode.removeChild(pal);
    document.removeEventListener("click", onDocClick, true);
    pal = null;
  }
  function onDocClick(ev) {
    if (pal && !pal.contains(ev.target)) closePal();
  }
  function openPal(anchor, cur, onPick) {
    closePal();
    var host = anchor.closest("dialog") || document.body;
    var p = document.createElement("div");
    p.className = "pal";

    var none = document.createElement("button");
    none.className = "none"; none.title = "默认颜色"; none.type = "button"; none.textContent = "×";
    if (!cur) none.classList.add("on");
    none.addEventListener("click", function () { onPick(""); closePal(); });
    p.appendChild(none);

    PAL.forEach(function (k) {
      var b = document.createElement("button");
      b.type = "button";
      b.setAttribute("data-c", k);
      b.title = PALN[k];
      if (cur === k) b.classList.add("on");
      b.addEventListener("click", function () { onPick(k); closePal(); });
      p.appendChild(b);
    });

    host.appendChild(p);
    var r = anchor.getBoundingClientRect();
    p.style.left = "0px"; p.style.top = "0px";
    var pw = p.offsetWidth, ph = p.offsetHeight;
    var left = Math.min(r.left, window.innerWidth - pw - 10);
    var top = r.bottom + 8;
    if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 8);
    p.style.left = Math.max(8, left) + "px";
    p.style.top = top + "px";
    pal = p;
    setTimeout(function () { document.addEventListener("click", onDocClick, true); }, 0);
  }
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") closePal(); });

  /* ---------------- 编辑器 ---------------- */
  var dlg = $("dlg"), rt = $("fBody"), rtBar = $("rtBar");
  var tagPrev = $("tagPrev"), cardSw = $("cardSw");

  function parseTags(v) {
    return String(v || "").split(/[,，、;；\s]+/)
      .map(function (s) { return s.trim(); })
      .filter(function (s, i, a) { return s && a.indexOf(s) === i; });
  }

  function renderTagPrev() {
    var arr = parseTags($("fTags").value);
    tagPrev.innerHTML = "";
    if (!arr.length) {
      var h = document.createElement("span");
      h.className = "tagprev-h";
      h.textContent = "标签会显示在这里；点标签可以单独设它的颜色。";
      tagPrev.appendChild(h);
      return;
    }
    arr.forEach(function (t) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tag";
      b.textContent = t;
      var ck = colorOfTag(t, editingColor);
      if (ck) b.setAttribute("data-c", ck);
      b.title = "设置「" + t + "」的颜色";
      b.addEventListener("click", function (ev) {
        ev.preventDefault();
        openPal(b, tagColors[t] || "", function (pick) {
          if (pick) tagColors[t] = pick; else delete tagColors[t];
          saveTagColors(); renderTagPrev(); render();
        });
      });
      tagPrev.appendChild(b);
    });
  }

  function renderCardSw() {
    cardSw.innerHTML = "";
    var none = document.createElement("button");
    none.type = "button";
    none.className = "none" + (editingColor ? "" : " on");
    none.title = "默认（纸色）";
    none.addEventListener("click", function () { editingColor = ""; renderCardSw(); renderTagPrev(); });
    cardSw.appendChild(none);
    PAL.forEach(function (k) {
      var b = document.createElement("button");
      b.type = "button";
      b.setAttribute("data-c", k);
      b.title = PALN[k];
      if (editingColor === k) b.classList.add("on");
      b.addEventListener("click", function () { editingColor = k; renderCardSw(); renderTagPrev(); });
      cardSw.appendChild(b);
    });
  }

  function renderGroupOpts() {
    var opts = $("groupOpts");
    opts.innerHTML = "";
    allGroups().forEach(function (g) {
      var o = document.createElement("option");
      o.value = g.name;
      opts.appendChild(o);
    });
  }

  function openEditor(id) {
    editingId = id || null;
    var e = id ? entries.filter(function (x) { return x.id === id; })[0] : null;
    $("dlgTitle").textContent = e ? "编辑这一条" : "新增一条";
    $("fTitle").value = e ? e.title : "";
    $("fGroup").value = e ? (e.group || "") : "";
    $("fTags").value = e ? (e.tags || []).join(", ") : "";
    rt.innerHTML = e ? (e.body || "") : "";
    editingColor = e && e.color && PALN[e.color] ? e.color : "";
    renderGroupOpts();
    renderCardSw();
    renderTagPrev();
    closePal();
    if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
    setTimeout(function () { $("fTitle").focus(); }, 60);
  }

  function closeEditor() {
    closePal();
    if (typeof dlg.close === "function") dlg.close(); else dlg.removeAttribute("open");
  }

  function commit() {
    var title = $("fTitle").value.trim();
    var html = clean(rt.innerHTML);
    var plain = textOf(html).replace(/\s+/g, " ").trim();
    var tags = parseTags($("fTags").value);
    var group = $("fGroup").value.trim().replace(/\s+/g, " ");

    if (!title && !plain) { alert("标题和正文至少填一个。"); return; }

    if (editingId) {
      entries = entries.map(function (e) {
        if (e.id !== editingId) return e;
        return {
          id: e.id, title: title, body: html, rich: true, tags: tags,
          group: group, color: editingColor, created: e.created, updated: now()
        };
      });
    } else {
      entries.unshift({
        id: uid(), title: title, body: html, rich: true, tags: tags,
        group: group, color: editingColor, created: now(), updated: now()
      });
    }
    if (save(entries)) { closeEditor(); render(); }
  }

  $("add").addEventListener("click", function () { openEditor(null); });
  $("saveBtn").addEventListener("click", commit);
  $("cancelBtn").addEventListener("click", closeEditor);
  $("fTags").addEventListener("input", renderTagPrev);
  dlg.addEventListener("cancel", function (ev) { ev.preventDefault(); closeEditor(); });
  dlg.addEventListener("keydown", function (ev) {
    if ((ev.metaKey || ev.ctrlKey) && ev.key === "Enter") { ev.preventDefault(); commit(); }
  });

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "n" && (ev.metaKey || ev.ctrlKey)) {
      ev.preventDefault();
      if (!dlg.open) openEditor(null);
    }
  });

  /* 富文本工具条：mousedown 阻止默认，保住选区 */
  rtBar.addEventListener("mousedown", function (ev) {
    if (ev.target.closest("button")) ev.preventDefault();
  });
  rtBar.addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    var fg = b.getAttribute("data-fg");
    if (fg) {
      var hex = (isDark() ? DHEX : LHEX)[fg];
      try { document.execCommand("styleWithCSS", false, true); } catch (e) {}
      document.execCommand("foreColor", false, hex);
      rt.focus();
      return;
    }
    var cmd = b.getAttribute("data-cmd");
    if (cmd) document.execCommand(cmd, false, null);
  });
  /* 粘贴时把明显的外部样式压掉一层，避免粘进整站样式 */
  rt.addEventListener("paste", function () {
    setTimeout(function () { rt.innerHTML = clean(rt.innerHTML); }, 0);
  });

  /* ---------------- 标签颜色面板 ---------------- */
  var tagDlg = $("tagDlg"), tagRows = $("tagRows");

  function buildTagCfg() {
    var names = allTags().map(function (t) { return t.name; });
    tagRows.innerHTML = "";
    if (!names.length) {
      var p = document.createElement("p");
      p.className = "hint";
      p.style.margin = "4px 0 16px";
      p.textContent = "还没有标签。写一条带标签的笔记，这里就会出现它。";
      tagRows.appendChild(p);
      return;
    }
    names.forEach(function (nm) {
      var row = document.createElement("div");
      row.className = "trow";

      var t = document.createElement("span");
      t.className = "tname"; t.textContent = nm; t.title = nm;
      row.appendChild(t);

      var dots = document.createElement("div");
      dots.className = "tdots";

      var none = document.createElement("button");
      none.type = "button";
      none.className = "dot none" + (tagColors[nm] ? "" : " on");
      none.title = "默认颜色";
      none.addEventListener("click", function () {
        delete tagColors[nm]; saveTagColors(); buildTagCfg(); render();
      });
      dots.appendChild(none);

      PAL.forEach(function (k) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "dot" + (tagColors[nm] === k ? " on" : "");
        b.setAttribute("data-c", k);
        b.title = PALN[k];
        b.addEventListener("click", function () {
          tagColors[nm] = k; saveTagColors(); buildTagCfg(); render();
        });
        dots.appendChild(b);
      });

      row.appendChild(dots);
      tagRows.appendChild(row);
    });
  }

  function openTagCfg() {
    buildTagCfg();
    if (typeof tagDlg.showModal === "function") tagDlg.showModal(); else tagDlg.setAttribute("open", "");
  }
  $("tagDone").addEventListener("click", function () {
    if (tagDlg.open) tagDlg.close();
  });
  tagDlg.addEventListener("cancel", function (ev) {
    ev.preventDefault();
    if (tagDlg.open) tagDlg.close();
  });

  /* ---------------- 云端同步（GitHub 私有仓库） ---------------- */
  var CLOUD_REPO = { owner: "wuy9", repo: "nannan-notes-data", path: "notes.json" };
  var CTOKEN = "nn.cloud.token";
  var cloudToken = "";
  try { cloudToken = localStorage.getItem(CTOKEN) || ""; } catch (e) {}
  var apiBase = "https://api.github.com";
  try { if (localStorage.getItem("nn.api.base")) apiBase = localStorage.getItem("nn.api.base"); } catch (e) {}

  var cloud = { sha: null, syncing: false, dirty: false, ready: false, state: "off", at: "", err: "" };

  function b64enc(s) {
    var bytes = new TextEncoder().encode(s), bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function b64dec(b) {
    var bin = atob(String(b || "").replace(/\s/g, ""));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function fileURL() {
    return apiBase + "/repos/" + CLOUD_REPO.owner + "/" + CLOUD_REPO.repo + "/contents/" + CLOUD_REPO.path;
  }
  function ghHeaders() {
    return {
      "Authorization": "Bearer " + cloudToken,
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json"
    };
  }
  function cloudDoc() {
    return { v: 2, updatedAt: now(), tagColors: tagColors, entries: entries };
  }

  async function cloudPull() {
    var r = await fetch(fileURL() + "?ref=main&t=" + Date.now(), { headers: ghHeaders(), cache: "no-store" });
    if (r.status === 404) { cloud.sha = null; return null; }
    if (!r.ok) throw new Error(r.status === 401 ? "令牌无效或权限不足（需勾选 repo）" : "读取失败 HTTP " + r.status);
    var j = await r.json();
    cloud.sha = j.sha;
    return JSON.parse(b64dec(j.content));
  }

  async function cloudPush(msg) {
    var payload = { message: msg || "更新笔记", content: b64enc(JSON.stringify(cloudDoc(), null, 2)), branch: "main" };
    if (cloud.sha) payload.sha = cloud.sha;
    var r = await fetch(fileURL(), { method: "PUT", headers: ghHeaders(), body: JSON.stringify(payload) });

    if (r.status === 409 || r.status === 412 || r.status === 422) {
      // 云端被别人（或另一台设备）改过，取最新 sha 再覆盖一次
      var f = await fetch(fileURL() + "?ref=main&t=" + Date.now(), { headers: ghHeaders(), cache: "no-store" });
      if (f.ok) { var fj = await f.json(); cloud.sha = fj.sha; }
      payload.sha = cloud.sha;
      if (!payload.sha) delete payload.sha;
      r = await fetch(fileURL(), { method: "PUT", headers: ghHeaders(), body: JSON.stringify(payload) });
    }
    if (!r.ok) {
      if (r.status === 401) throw new Error("令牌无效或已过期");
      if (r.status === 403) throw new Error("没有写权限（令牌需勾选 repo）");
      if (r.status === 404) throw new Error("仓库 " + CLOUD_REPO.owner + "/" + CLOUD_REPO.repo + " 不存在");
      throw new Error("写入失败 HTTP " + r.status);
    }
    var jr = await r.json();
    if (jr && jr.content && jr.content.sha) cloud.sha = jr.content.sha;
    cloud.at = new Date().toTimeString().slice(0, 5);
    return true;
  }

  function applyRemote(d) {
    entries = migrate(Array.isArray(d.entries) ? d.entries : []);
    tagColors = (d.tagColors && typeof d.tagColors === "object" && !Array.isArray(d.tagColors)) ? d.tagColors : {};
    try {
      localStorage.setItem(KEY, JSON.stringify(entries));
      localStorage.setItem(TKEY, JSON.stringify(tagColors));
    } catch (e) {}
  }

  var statusText = {
    off: "本地保存", ok: "已存云端", saving: "正在保存…", error: "保存失败"
  };
  function setCloud(s, err) {
    cloud.state = s;
    cloud.err = s === "error" ? (err || "") : "";
    var btn = $("cloudBtn");
    if (!btn) return;
    btn.setAttribute("data-s", s);
    var label = statusText[s] || "云端";
    if (s === "ok" && cloud.at) label += " · " + cloud.at;
    btn.textContent = label;
    btn.title = s === "error" ? (cloud.err || "保存失败，点这里重试") : "点这里设置云端同步";

    var st = $("cloudSt");
    if (st) {
      st.className = "st" + (s === "error" ? " bad" : s === "ok" ? " good" : "");
      if (!cloudToken) st.textContent = "未连接，现在只存在这台设备的浏览器里。";
      else if (s === "error") st.textContent = "同步失败：" + cloud.err + "。本地还有一份，没丢。";
      else if (s === "saving") st.textContent = "正在写入云端…";
      else if (s === "ok") st.textContent = "已连接 · 最近一次写入 " + (cloud.at || "刚刚");
    }
  }

  var syncTimer = null;
  function scheduleSync() {
    if (!cloudToken || !cloud.ready) return;
    cloud.dirty = true;
    setCloud("saving");
    clearTimeout(syncTimer);
    syncTimer = setTimeout(runSync, 700);
  }
  async function runSync() {
    if (cloud.syncing) return;
    cloud.syncing = true;
    cloud.dirty = false;
    try {
      await cloudPush("更新 " + new Date().toLocaleString("zh-CN"));
      setCloud("ok");
    } catch (e) {
      setCloud("error", e.message);
    } finally {
      cloud.syncing = false;
      if (cloud.dirty) runSync();
    }
  }

  async function connectCloud() {
    var t = $("cloudToken").value.trim();
    if (!t) { setCloud("error", "先粘贴令牌"); cloudToken = ""; return; }
    cloudToken = t;
    try { localStorage.setItem(CTOKEN, t); } catch (e) {}
    cloud.sha = null;
    setCloud("saving");
    try {
      var remote = await cloudPull();
      if (!remote) {
        await cloudPush("首次同步：" + entries.length + " 条笔记");
      } else {
        var rn = (remote.entries || []).length, ln = entries.length;
        if (rn === 0) {
          await cloudPush("云端为空，写入本地 " + ln + " 条");
        } else if (ln === 0) {
          applyRemote(remote);
        } else if (confirm("云端已有 " + rn + " 条，本地有 " + ln + " 条。\n\n点「确定」：用**云端**覆盖本地（新设备/重装就选这个）\n点「取消」：用**本地**覆盖云端（刚连上、本地才是你要的）")) {
          applyRemote(remote);
        } else {
          await cloudPush("用本地内容覆盖云端");
        }
      }
      cloud.ready = true;
      setCloud("ok");
      render();
    } catch (e) {
      cloud.ready = false;
      setCloud("error", e.message);
      $("cloudSt").textContent = "连接失败：" + e.message + "。请确认令牌勾了 repo、仓库已建好。";
    }
  }

  function disconnectCloud() {
    if (!confirm("断开后笔记只存在这台设备的浏览器里，不再往云端写。确定？")) return;
    try { localStorage.removeItem(CTOKEN); } catch (e) {}
    cloudToken = "";
    cloud.ready = true;
    cloud.sha = null;
    setCloud("off");
  }

  async function bootCloud() {
    if (!cloudToken) { cloud.ready = true; setCloud("off"); return; }
    setCloud("saving");
    try {
      var remote = await cloudPull();
      if (remote && Array.isArray(remote.entries) && remote.entries.length) {
        applyRemote(remote);
        setCloud("ok");
        render();
      } else {
        await cloudPush("首次同步：" + entries.length + " 条笔记");
        setCloud("ok");
      }
    } catch (e) {
      setCloud("error", e.message);
    }
    cloud.ready = true;
  }

  var cloudDlg = $("cloudDlg");
  function openCloud() {
    $("cloudToken").value = cloudToken;
    $("cloudOff").hidden = !cloudToken;
    $("cloudConnect").textContent = cloudToken ? "立即同步" : "连接并同步";
    setCloud(cloud.state);
    if (typeof cloudDlg.showModal === "function") cloudDlg.showModal(); else cloudDlg.setAttribute("open", "");
    if (!cloudToken) setTimeout(function () { $("cloudToken").focus(); }, 80);
  }
  $("cloudBtn").addEventListener("click", openCloud);
  $("cloudDone").addEventListener("click", function () { if (cloudDlg.open) cloudDlg.close(); });
  $("cloudOff").addEventListener("click", disconnectCloud);
  $("cloudConnect").addEventListener("click", connectCloud);
  $("cloudToken").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") { ev.preventDefault(); connectCloud(); }
  });
  cloudDlg.addEventListener("cancel", function (ev) { ev.preventDefault(); cloudDlg.close(); });

  window.addEventListener("online", function () {
    if (cloudToken && cloud.state === "error") { cloud.ready = true; runSync(); }
  });

  /* ---------------- 导入 / 导出 ---------------- */
  $("expBtn").addEventListener("click", function () {
    var pack = { v: 2, exportedAt: now(), tagColors: tagColors, entries: entries };
    var blob = new Blob([JSON.stringify(pack, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    var d = new Date();
    var p = function (n) { return n < 10 ? "0" + n : "" + n; };
    a.href = URL.createObjectURL(blob);
    a.download = "沉淀库备份-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  $("impBtn").addEventListener("click", function () { $("impFile").click(); });
  $("impFile").addEventListener("change", function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var data = JSON.parse(fr.result);
        var arr = Array.isArray(data) ? data : (data && Array.isArray(data.entries) ? data.entries : null);
        if (!arr) throw new Error("格式不对");

        if (!Array.isArray(data) && data.tagColors && typeof data.tagColors === "object") {
          Object.keys(data.tagColors).forEach(function (k) {
            if (PALN[data.tagColors[k]]) tagColors[k] = data.tagColors[k];
          });
          saveTagColors();
        }

        var ok = arr.filter(function (e) { return e && (e.title || e.body); }).map(function (e) {
          return migrate([e])[0];
        });

        if (!confirm("导入 " + ok.length + " 条，会和现有 " + entries.length + " 条合并。继续？")) return;
        var seen = {};
        entries.forEach(function (e) { seen[e.id] = 1; });
        ok.forEach(function (e) {
          if (seen[e.id]) e.id = uid();
          entries.push(e); seen[e.id] = 1;
        });
        if (save(entries)) { render(); alert("已导入 " + ok.length + " 条。"); }
      } catch (err) {
        alert("这个文件读不出来，需要是本站导出的 JSON 备份。");
      } finally {
        ev.target.value = "";
      }
    };
    fr.readAsText(f);
  });

  render();
  bootCloud();
})();
</script>
</body>
</html>
